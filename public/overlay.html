<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Kick Timeout Overlay</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial,Tahoma,sans-serif}.stage{position:fixed;inset:0;display:flex;justify-content:center;pointer-events:none;padding:60px;box-sizing:border-box}.stage.top{align-items:flex-start}.stage.center{align-items:center}.stage.bottom{align-items:flex-end}
    .alert{--accent:#53fc18;position:relative;width:min(820px,86vw);min-height:160px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:22px;padding:24px 28px;border-radius:26px;color:white;opacity:0;transform:translateY(30px) scale(.94);transition:.46s cubic-bezier(.2,.85,.25,1);filter:drop-shadow(0 25px 50px rgba(0,0,0,.48));box-sizing:border-box}.alert.show{opacity:1;transform:translateY(0) scale(1)}.alert.hide{opacity:0;transform:translateY(-24px) scale(.97)}.avatar-wrap{position:relative}.avatar{width:108px;height:108px;border-radius:24px;object-fit:cover;border:2px solid var(--accent);background:#131313}.avatar-wrap:after{content:'!';position:absolute;left:-9px;top:-9px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#070707;font-weight:900}.title{font-size:30px;font-weight:900;margin-bottom:10px}.subtitle{font-size:17px;opacity:.82;margin-bottom:8px}.reason{font-size:14px;opacity:.68}.logo{max-width:92px;max-height:92px;object-fit:contain}.fallback-logo{font-size:18px;font-weight:900;letter-spacing:1px;color:var(--accent);writing-mode:vertical-rl}.royal{background:linear-gradient(135deg,rgba(18,14,8,.96),rgba(36,26,11,.96));border:1px solid #aa7b31;box-shadow:inset 0 0 40px rgba(193,143,47,.12)}.royal:before,.royal:after{content:'';position:absolute;inset:10px;border:1px solid rgba(221,174,85,.25);border-radius:19px}.royal .title{text-shadow:0 2px 16px rgba(210,158,55,.26)}.swat{background:linear-gradient(110deg,rgba(10,12,15,.98),rgba(29,8,12,.98));border:1px solid #6b1f2c;clip-path:polygon(0 0,97% 0,100% 18%,100% 100%,3% 100%,0 82%)}.swat:before{content:'TIMEOUT // MOD ACTION';position:absolute;top:10px;left:22px;font-size:10px;letter-spacing:2px;color:#ff5267}.neon{background:linear-gradient(135deg,rgba(5,11,6,.95),rgba(11,25,13,.95));border:1px solid var(--accent);box-shadow:0 0 35px rgba(83,252,24,.24),inset 0 0 35px rgba(83,252,24,.10)}.minimal{background:rgba(10,12,10,.9);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(12px)}.progress{position:absolute;bottom:0;right:24px;left:24px;height:3px;background:rgba(255,255,255,.08);overflow:hidden;border-radius:999px}.progress>i{display:block;width:100%;height:100%;background:var(--accent);transform-origin:right;animation:drain linear forwards}@keyframes drain{from{transform:scaleX(1)}to{transform:scaleX(0)}}

    .fullscreen-alert{--accent:#53fc18;position:absolute;inset:0;color:#fff;opacity:0;transform:scale(1.03);transition:.55s cubic-bezier(.2,.85,.25,1);overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center}.fullscreen-alert.show{opacity:1;transform:scale(1)}.fullscreen-alert.hide{opacity:0;transform:scale(.985)}.fs-bg{position:absolute;inset:-3%;background-position:center;background-size:cover;filter:blur(1px) saturate(.85);transform:scale(1.04)}.fs-bg:after{content:'';position:absolute;inset:0;background:rgba(0,0,0,var(--dim,.68))}.fs-vignette{position:absolute;inset:0;background:radial-gradient(circle at 50% 43%,transparent 0 20%,rgba(0,0,0,.28) 48%,rgba(0,0,0,.78) 100%)}.fs-lines{position:absolute;inset:0;opacity:.15;background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:70px 70px}.fs-core{position:relative;z-index:2;width:min(1050px,88vw);display:flex;flex-direction:column;align-items:center}.fs-kicker{font-size:13px;letter-spacing:7px;text-transform:uppercase;color:var(--accent);font-weight:900;margin-bottom:24px}.fs-avatar-wrap{position:relative;margin-bottom:25px}.fs-avatar-wrap:before,.fs-avatar-wrap:after{content:'';position:absolute;border-radius:50%;inset:-14px;border:1px solid var(--accent);opacity:.48}.fs-avatar-wrap:after{inset:-30px;opacity:.16}.fs-avatar{width:180px;height:180px;border-radius:50%;object-fit:cover;border:4px solid var(--accent);box-shadow:0 0 60px rgba(0,0,0,.65)}.fs-title{font-size:clamp(42px,5vw,78px);font-weight:900;letter-spacing:-2px;text-shadow:0 10px 40px rgba(0,0,0,.7);margin-bottom:18px}.fs-subtitle{font-size:clamp(18px,2vw,28px);opacity:.84;margin-bottom:14px}.fs-reason{font-size:clamp(14px,1.4vw,20px);opacity:.68}.fs-logo{position:absolute;right:55px;top:45px;z-index:3;max-width:130px;max-height:90px;object-fit:contain}.fs-badge{position:absolute;left:55px;top:45px;z-index:3;color:var(--accent);font-size:12px;font-weight:900;letter-spacing:4px}.fs-progress{position:absolute;z-index:4;bottom:0;left:0;right:0;height:6px;background:rgba(255,255,255,.07)}.fs-progress i{display:block;width:100%;height:100%;background:var(--accent);transform-origin:right;animation:drain linear forwards}.fullscreen-alert.royal-fs{background:radial-gradient(circle at 50% 40%,rgba(108,75,22,.42),rgba(7,5,2,.96) 72%)}.fullscreen-alert.royal-fs .fs-lines{background-image:linear-gradient(rgba(202,158,74,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(202,158,74,.06) 1px,transparent 1px)}.fullscreen-alert.royal-fs:before,.fullscreen-alert.royal-fs:after{content:'';position:absolute;inset:28px;border:1px solid rgba(210,165,78,.28);pointer-events:none}.fullscreen-alert.royal-fs:after{inset:40px}.fullscreen-alert.swat-fs{background:radial-gradient(circle at 50% 45%,rgba(112,18,34,.34),rgba(5,6,8,.98) 72%)}.fullscreen-alert.swat-fs .fs-kicker{color:#ff4057}.fullscreen-alert.swat-fs .fs-avatar{border-color:#ff4057}.fullscreen-alert.neon-fs{background:radial-gradient(circle at 50% 45%,rgba(42,141,41,.30),rgba(3,8,4,.98) 70%)}.fullscreen-alert.neon-fs:before{content:'';position:absolute;inset:0;box-shadow:inset 0 0 130px rgba(83,252,24,.12)}.fullscreen-alert.minimal-fs{background:rgba(5,7,6,.94)}
  </style>
</head>
<body>
  <div id="stage" class="stage center"></div>
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const token=location.pathname.split('/').pop();
    const stage=document.getElementById('stage');
    let settings=null,queue=[],busy=false;
    const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const replace=(tpl,e)=>String(tpl||'').replaceAll('{username}',e.username||'').replaceAll('{moderator}',e.moderator||'').replaceAll('{duration}',e.duration||'').replaceAll('{reason}',e.reason||'');
    async function load(){const r=await fetch('/api/overlay-config/'+token,{cache:'no-store'});if(!r.ok)return;settings=(await r.json()).settings;applyPosition()}
    function applyPosition(){stage.className='stage '+(settings?.layoutMode==='fullscreen'?'center':(settings?.position||'center'))}
    function sound(){if(!settings?.customSoundUrl)return;const a=new Audio(settings.customSoundUrl);a.volume=Math.max(0,Math.min(1,Number(settings.volume??.75)));a.play().catch(()=>{})}
    function renderCard(e){
      const s=settings||{},theme=s.theme||'royal',dur=Number(s.durationMs||6500);
      const logo=s.customLogoUrl?`<img class="logo" src="${esc(s.customLogoUrl)}">`:`<div class="fallback-logo">KICK</div>`;
      const avatar=s.showAvatar?`<div class="avatar-wrap"><img class="avatar" src="${esc(e.avatar||'https://kick.com/img/default-profile-pictures/default2.jpeg')}"></div>`:'';
      const subtitle=(s.showDuration||s.showModerator)?`<div class="subtitle">${esc(replace(s.subtitleTemplate,e))}</div>`:'';
      const reason=s.showReason?`<div class="reason">السبب: ${esc(e.reason||'بدون سبب')}</div>`:'';
      const el=document.createElement('div');el.className='alert '+theme;el.style.setProperty('--accent',s.accent||'#53fc18');
      el.innerHTML=`${avatar}<div class="content"><div class="title">${esc(replace(s.titleTemplate,e))}</div>${subtitle}${reason}</div>${logo}<div class="progress"><i style="animation-duration:${dur}ms"></i></div>`;
      return el;
    }
    function renderFullscreen(e){
      const s=settings||{},theme=s.theme||'royal',dur=Number(s.durationMs||6500),map={royal:'royal-fs',swat:'swat-fs',neon:'neon-fs',minimal:'minimal-fs'};
      const bg=s.fullscreenBackgroundUrl?`<div class="fs-bg" style="background-image:url('${esc(s.fullscreenBackgroundUrl)}');--dim:${Number(s.fullscreenDim??.68)}"></div>`:`<div class="fs-bg" style="--dim:${Number(s.fullscreenDim??.68)}"></div>`;
      const avatar=s.showAvatar?`<div class="fs-avatar-wrap"><img class="fs-avatar" src="${esc(e.avatar||'https://kick.com/img/default-profile-pictures/default2.jpeg')}"></div>`:'';
      const subtitle=(s.showDuration||s.showModerator)?`<div class="fs-subtitle">${esc(replace(s.subtitleTemplate,e))}</div>`:'';
      const reason=s.showReason?`<div class="fs-reason">السبب: ${esc(e.reason||'بدون سبب')}</div>`:'';
      const logo=s.customLogoUrl?`<img class="fs-logo" src="${esc(s.customLogoUrl)}">`:'';
      const el=document.createElement('div');el.className='fullscreen-alert '+(map[theme]||'royal-fs');el.style.setProperty('--accent',s.accent||'#53fc18');
      el.innerHTML=`${bg}<div class="fs-vignette"></div><div class="fs-lines"></div>${logo}<div class="fs-badge">MODERATION // TIMEOUT</div><div class="fs-core"><div class="fs-kicker">TIMEOUT</div>${avatar}<div class="fs-title">${esc(replace(s.titleTemplate,e))}</div>${subtitle}${reason}</div><div class="fs-progress"><i style="animation-duration:${dur}ms"></i></div>`;
      return el;
    }
    function render(e){
      const s=settings||{},dur=Number(s.durationMs||6500);
      applyPosition();
      const el=s.layoutMode==='fullscreen'?renderFullscreen(e):renderCard(e);
      stage.appendChild(el);requestAnimationFrame(()=>el.classList.add('show'));sound();
      setTimeout(()=>{el.classList.add('hide');setTimeout(()=>{el.remove();busy=false;next()},600)},dur);
    }
    function next(){if(busy||!queue.length)return;busy=true;render(queue.shift())}
    const socket=io({transports:['websocket','polling']});
    socket.on('connect',()=>socket.emit('join-overlay',token));
    socket.on('timeout-alert',e=>{queue.push(e);next()});
    socket.on('settings-updated',s=>{settings=s;applyPosition()});
    load();
  </script>
</body>
</html>
